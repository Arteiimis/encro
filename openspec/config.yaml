schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above. Pointers only: ordering and gates
# for our review flow live in AGENTS.md, so nothing here restates them.
operations:
  apply:
    guidance:
      - Finish by checking off tasks.md; before committing, follow the review chain in AGENTS.md (verify first, then code review).
  archive:
    guidance:
      - The change should already carry a verify report; any REMOVED/RENAMED entry that report marks not verified is either resolved or explicitly accepted.
      - Two or more changes ready at once are archived through the bulk-archive workflow, not as repeated single archives.
