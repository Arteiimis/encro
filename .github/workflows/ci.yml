name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TEMP: debug only while POSIX compile errors are fixed; restore full matrix after green
        mode: [debug]
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/cache@v4
        with:
          # 包目录内部按 mode/buildhash 分区，一个 key 覆盖三模式产物
          path: ~/.xmake/packages
          key: xmake-packages-${{ hashFiles('xmake.lua') }}

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          # clang-18 的 __cpp_concepts=201907L 使 libstdc++ <expected> 空（clang 19 修复，PR #87998）；
          # ubuntu 24.04 官方源只有 clang-18，需 apt.llvm.org 的 clang-19
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain.list
          sudo apt-get update
          sudo apt-get install -y clang-19 g++-14 llvm-19 ffmpeg
          # clang-19 与 llvm-profdata/llvm-cov 同版本（coverage 插件按无后缀名查找）
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 110
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 110
          sudo ln -sf /usr/bin/llvm-profdata-19 /usr/local/bin/llvm-profdata
          sudo ln -sf /usr/bin/llvm-cov-19 /usr/local/bin/llvm-cov
          # clang 默认配对 libstdc++-13（缺 std::print / views::enumerate），
          # 把 gcc/g++ 切到 14，让 clang 与 xmake 探测到 libstdc++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set g++ /usr/bin/g++-14

      - name: Configure
        run: xmake f -m ${{ matrix.mode }} -y

      - name: Diagnostics
        if: matrix.mode == 'debug'
        run: |
          clang++ --version | head -1
          printf '#include <expected>\nint main(){ std::expected<int,int> e=1; return *e-1; }\n' > /tmp/exp.cpp
          clang++ -std=c++23 -dM -E -x c++ /dev/null | grep -E "__cplusplus|__cpp_concepts|__cpp_lib_expected|_GLIBCXX_RELEASE"
          echo ---c++26---
          clang++ -std=c++26 -dM -E -x c++ /dev/null | grep -E "__cplusplus|__cpp_concepts|__cpp_lib_expected|_GLIBCXX_RELEASE"
          echo ---gcc-probe---
          clang++ -std=c++23 -fsyntax-only -v /tmp/exp.cpp 2>&1 | grep -iE "gcc installation|selected gcc"
          echo ---syntax---
          clang++ -std=c++23 -fsyntax-only /tmp/exp.cpp && echo "c++23 expected OK" || echo "c++23 expected FAIL"

      - name: Build
        if: matrix.mode != 'coverage'
        run: xmake build -vD encro encro_e2e_tool tests e2e_tests

      - name: Run unit tests
        if: matrix.mode != 'coverage'
        run: xmake run tests

      - name: Run e2e tests
        if: matrix.mode != 'coverage'
        run: xmake run e2e_tests

      - name: Run coverage (configures and builds itself)
        if: matrix.mode == 'coverage'
        run: xmake coverage --summary
