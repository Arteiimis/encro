name: ci

on:
  push:
    # 纯文档改动不触发 CI（如需手动验证，用 workflow_dispatch）
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.githooks/**'
      - 'openspec/**'
  workflow_dispatch:
    inputs:
      modes:
        description: 'JSON array of matrix modes, e.g. ["coverage"]'
        required: true
        default: '["debug","release","coverage"]'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.modes) || fromJSON('["debug","release","coverage"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/cache/restore@v5
        id: xmake-cache
        with:
          # 包目录内部按 mode/buildhash 分区，一个 key 覆盖三模式产物
          path: ~/.xmake/packages
          key: xmake-packages-${{ hashFiles('xmake.lua') }}
          # xmake.lua 小改动时退回上一个缓存，避免 boost 全量重建（LTO 版在
          # 4 核 runner 上曾跑到 40min 超时）；命中旧缓存后 xmake 只重编增量。
          restore-keys: |
            xmake-packages-

      - name: Install toolchain and dependencies
        # apt.llvm.org has wedged runner installs before (wget stalls without
        # a timeout); fail fast instead of occupying a runner for 6h.
        timeout-minutes: 10
        run: bash scripts/setup-linux-env.sh

      - uses: actions/cache/restore@v5
        id: xmake-ccache
        # coverage 模式幂等性要求禁用 ccache（xmake.lua），不缓存它
        if: matrix.mode != 'coverage'
        with:
          # xmake 内置内容寻址编译缓存（build/.build_cache）：源码哈希/编译器
          # 身份/flag 作 key，不受 checkin mtime 影响，fresh runner 上也能命中。
          # 按 mode 分 key 避免平行矩阵 job 并发写同一缓存条目。
          path: build/.build_cache
          key: xmake-ccache-${{ matrix.mode }}-${{ hashFiles('xmake.lua', 'scripts/setup-linux-env.sh') }}
          # xmake.lua/工具链脚本小改动时退回上一个缓存代际
          restore-keys: |
            xmake-ccache-${{ matrix.mode }}-

      - name: Configure
        # 包构建（boost）在 4 核 runner 上开 LTO 会跑到 6h 超时；timeout 兜底快速失败
        timeout-minutes: 40
        run: xmake f -m ${{ matrix.mode }} -y

      - name: Diagnostics
        if: matrix.mode == 'debug'
        run: |
          clang++ --version | head -1
          printf '#include <expected>\nint main(){ std::expected<int,int> e=1; return *e-1; }\n' > /tmp/exp.cpp
          clang++ -std=c++23 -dM -E -x c++ /dev/null | grep -E "__cplusplus|__cpp_concepts|__cpp_lib_expected|_GLIBCXX_RELEASE"
          echo ---c++26---
          clang++ -std=c++26 -dM -E -x c++ /dev/null | grep -E "__cplusplus|__cpp_concepts|__cpp_lib_expected|_GLIBCXX_RELEASE"
          echo ---gcc-probe---
          clang++ -std=c++23 -fsyntax-only -v /tmp/exp.cpp 2>&1 | grep -iE "gcc installation|selected gcc"
          echo ---syntax---
          clang++ -std=c++23 -fsyntax-only /tmp/exp.cpp && echo "c++23 expected OK" || echo "c++23 expected FAIL"

      - name: Build
        if: matrix.mode != 'coverage'
        run: xmake build -vD encro encro_e2e_tool tests e2e_tests

      - name: Run unit tests
        if: matrix.mode != 'coverage'
        run: |
          set -o pipefail
          # JUnit 报告：失败时输出失败测试名（非 TTY 下进度条帧已被抑制，日志干净）
          ./build/linux/x86_64/${{ matrix.mode }}/tests -r junit -o /tmp/ut.xml > /tmp/ut.log 2>&1
          ec=$?
          tail -20 /tmp/ut.log
          if [ $ec -ne 0 ]; then
            grep -oE '<testcase[^>]*>[^<]*<failure[^>]*>[^<]*' /tmp/ut.xml | head -10
            grep -oE 'message="[^"]*"' /tmp/ut.xml | head -10
          fi
          exit $ec

      - name: Run e2e tests
        if: matrix.mode != 'coverage'
        timeout-minutes: 20
        run: xmake run e2e_tests

      - name: Upload test reports
        # 每次 run（含成功）都把 JUnit 报告 + console 日志 + encro 运行日志（含
        # ffmpeg stderr）+ 保留的 e2e 失败现场目录留为 artifact，由 debug-collect
        # 汇总成统一的 ci-run-* 包。必须放在所有测试步骤之后：原 failure() 在此处
        # 指“上一步失败”，提前放置会在 e2e 失败时错过上传；改为 always() 后始终执行。
        if: always() && matrix.mode != 'coverage'
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ matrix.mode }}
          path: |
            /tmp/ut.xml
            /tmp/ut.log
            ~/.local/state/encro/logs/
            /tmp/video_encoder_tests_*
          if-no-files-found: warn

      - name: Print debug info locations
        # 失败时在 job log 末尾打印自包含的 debug 指引：agent/人类展开本步骤即可
        # 知道去哪里拿完整日志（统一 artifact 名、下载命令、文件清单、已知盲区）。
        if: failure()
        run: |
          echo "=== Debug info ==="
          echo "run=${{ github.run_id }} job=${{ matrix.mode }} (fetch job logs after the run finishes)"
          echo "1. This step's own log: REQUIRE_SUCCESS failures dump child stdout/stderr"
          echo "   plus the tail of the encro log named by 'Log file:' in stdout."
          echo "2. Unified run artifact (all reports + logs + e2e scratch, one zip):"
          echo "   gh run download ${{ github.run_id }} -n ci-run-*"
          echo "   contains: test-reports-<mode>/ (ut.xml JUnit + ut.log console +"
          echo "             ~/.local/state/encro/logs/ + preserved e2e scratch dirs)"
          echo "             coverage-report/ (when the coverage job ran)"
          echo "3. Failed unit tests: grep -oE '<testcase[^>]*>[^<]*<failure[^>]*>[^<]*' /tmp/ut.xml"
          echo "4. Caveat: spdlog rotation (keep=10) may drop the failing test's"
          echo "   encro log from the artifact; its tail is always in the step-log dump."
          if [ "${{ matrix.mode }}" = "coverage" ]; then
            echo "Coverage job: 'Run coverage' step log shows the summary; per-file HTML"
            echo "report is inside the unified artifact under coverage-report/ (also"
            echo "available standalone: gh run download ${{ github.run_id }} -n coverage-report)"
            echo "contains build/coverage/html/ + all.profdata (local re-report without rerun)."
          fi
          echo "===================="

      - name: Run coverage (configures and builds itself)
        if: matrix.mode == 'coverage'
        # --keep: 跳过插件末尾的 release restore（xmake 3 的 execv bug；CI 用完即弃）
        # --e2e: e2e 套件纳入覆盖统计（合并 e2e-%p.profraw；coverage-include-e2e change）
        # --html: 生成 build/coverage/html，由下方步骤上传为 artifact
        run: xmake coverage --e2e --summary --keep --html

      - name: Upload coverage report
        # always(): 测试失败也留报告；插件早期失败时 html 不存在 → warn 不报错
        if: always() && matrix.mode == 'coverage'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            build/coverage/html/
            build/coverage/all.profdata
          if-no-files-found: warn

      - name: Save xmake packages cache
        # 显式保存（job 失败也保存，否则每次 miss 全量重编 boost）；命中时跳过避免重复 key
        if: always() && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ hashFiles('xmake.lua') }}

      - name: Save xmake ccache
        # 同 packages：失败也保存；命中时跳过（内容寻址缓存无跨代漂移，无需
        # 更新缓存条目）。coverage 模式无缓存可存。
        if: always() && matrix.mode != 'coverage' && steps.xmake-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/.build_cache
          key: xmake-ccache-${{ matrix.mode }}-${{ hashFiles('xmake.lua', 'scripts/setup-linux-env.sh') }}

  collect:
    # 统一 run artifact：无论成功失败，把各矩阵 job 的 test-reports-* 与
    # coverage-report 下载后打包为单个 ci-run-<ts>-r<run_id>（下载即单 zip，
    # 子目录按来源区分，ut.xml 等同名文件不冲突）。
    needs: linux
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp
        id: ts
        run: echo "ts=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          path: collect
          # 不带 merge-multiple：保留下载物各自子目录（test-reports-debug/ 等）
          pattern: '*'

      - uses: actions/upload-artifact@v5
        with:
          # run_id 尾缀保证同秒多次 run 的名字唯一（同名 artifact 会被 GitHub 合并）
          name: ci-run-${{ steps.ts.outputs.ts }}-r${{ github.run_id }}
          path: collect/
          retention-days: 90
          if-no-files-found: warn
