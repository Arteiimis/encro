name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TEMP: release deferred until debug+coverage stable
        mode: [debug, coverage]
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/cache/restore@v4
        id: xmake-cache
        with:
          # 包目录内部按 mode/buildhash 分区，一个 key 覆盖三模式产物
          path: ~/.xmake/packages
          key: xmake-packages-${{ hashFiles('xmake.lua') }}

      - name: Install toolchain and dependencies
        run: bash scripts/setup-linux-env.sh

      - name: Diag ffmpeg encoders
        run: ffmpeg -hide_banner -encoders | grep -E "265|264" || true
      - name: Configure
        run: xmake f -m ${{ matrix.mode }} -y

      - name: Diagnostics
        if: matrix.mode == 'debug'
        run: |
          clang++ --version | head -1
          printf '#include <expected>\nint main(){ std::expected<int,int> e=1; return *e-1; }\n' > /tmp/exp.cpp
          clang++ -std=c++23 -dM -E -x c++ /dev/null | grep -E "__cplusplus|__cpp_concepts|__cpp_lib_expected|_GLIBCXX_RELEASE"
          echo ---c++26---
          clang++ -std=c++26 -dM -E -x c++ /dev/null | grep -E "__cplusplus|__cpp_concepts|__cpp_lib_expected|_GLIBCXX_RELEASE"
          echo ---gcc-probe---
          clang++ -std=c++23 -fsyntax-only -v /tmp/exp.cpp 2>&1 | grep -iE "gcc installation|selected gcc"
          echo ---syntax---
          clang++ -std=c++23 -fsyntax-only /tmp/exp.cpp && echo "c++23 expected OK" || echo "c++23 expected FAIL"

      - name: Build
        if: matrix.mode != 'coverage'
        run: xmake build -vD encro encro_e2e_tool tests e2e_tests

      - name: Run unit tests
        if: matrix.mode != 'coverage'
        run: |
          set -o pipefail
          # JUnit 报告：失败时输出失败测试名（console 输出被进度条吞掉）
          ./build/linux/x86_64/${{ matrix.mode }}/tests -r junit -o /tmp/ut.xml > /tmp/ut.log 2>&1
          ec=$?
          tail -20 /tmp/ut.log
          if [ $ec -ne 0 ]; then
            grep -oE '<testcase[^>]*>[^<]*<failure[^>]*>[^<]*' /tmp/ut.xml | head -10
            grep -oE 'message="[^"]*"' /tmp/ut.xml | head -10
          fi
          exit $ec

      - name: Run e2e tests
        if: matrix.mode != 'coverage'
        timeout-minutes: 20
        run: xmake run e2e_tests

      - name: Run coverage (configures and builds itself)
        if: matrix.mode == 'coverage'
        # --keep: 跳过插件末尾的 release restore（xmake 3 的 execv bug；CI 用完即弃）
        run: xmake coverage --summary --keep

      - name: Save xmake packages cache
        # 显式保存（job 失败也保存，否则每次 miss 全量重编 boost）；命中时跳过避免重复 key
        if: always() && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ hashFiles('xmake.lua') }}
