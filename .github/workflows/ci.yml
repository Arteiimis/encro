name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release, coverage]
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: true
          package-cache-key: ${{ matrix.mode }}

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 g++-14 llvm ffmpeg
          # clang-18 由 apt 的 alternatives 注册（/usr/bin/clang -> clang-18）；
          # 它默认配对 libstdc++-13（缺 std::print / views::enumerate），
          # 把 gcc/g++ 切到 14，让 clang 与 xmake 探测到 libstdc++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set g++ /usr/bin/g++-14

      - name: Configure
        run: xmake f -m ${{ matrix.mode }}

      - name: Build
        if: matrix.mode != 'coverage'
        run: xmake build encro encro_e2e_tool tests e2e_tests

      - name: Run unit tests
        if: matrix.mode != 'coverage'
        run: xmake run tests

      - name: Run e2e tests
        if: matrix.mode != 'coverage'
        run: xmake run e2e_tests

      - name: Run coverage (configures and builds itself)
        if: matrix.mode == 'coverage'
        run: xmake coverage --summary
