name: release

# Entry points (design D5):
#   workflow_dispatch mode=dry-run  build both platforms, publish nothing
#   workflow_dispatch mode=publish  publish a named tag (also: tag push)
#   workflow_dispatch mode=backfill record missing entries up to a version
#
# A tag push cannot trigger a workflow that did not exist at the tagged commit,
# which is why the manual paths exist rather than being a convenience.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run builds both platforms and publishes nothing'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run

concurrency:
  # Never cancel a release in flight: half-published assets are exactly what
  # this workflow exists to prevent.
  group: release-${{ github.ref }}
  cancel-in-progress: false

# xmake disables its content-addressed build cache when CI=true unless this is
# set (see ci.yml for the same reason).
env:
  XMAKE_ACTION_BUILD_CACHE: '1'

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag-contract script reads `git tag -l` and
          # `git rev-list main --first-parent`; a default shallow checkout has
          # neither, so the gate would fail on its first line.
          fetch-depth: 0
          fetch-tags: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Report the toolchain the runner provides
        shell: pwsh
        run: |
          # Recorded because this is the first Windows CI build of this project:
          # the versions below are what any later "why did the release differ"
          # question has to be answered against.
          xmake --version
          clang-cl --version
          lld-link --version
          llvm-ar --version

      - name: Pin xmake's global directory to a path the cache can name
        shell: pwsh
        run: |
          # xmake appends `.xmake` to XMAKE_GLOBALDIR, so the variable names the
          # PARENT directory. Without this pin xmake prefers
          # %APPDATA%\.xmake on Windows, which makes `~/.xmake/packages` an empty
          # path and the cache silently stores nothing.
          "XMAKE_GLOBALDIR=$env:USERPROFILE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "pinned XMAKE_GLOBALDIR=$env:USERPROFILE"
          "expected packages dir: $env:USERPROFILE\.xmake\packages"

      - uses: actions/cache/restore@v6
        id: xmake-cache
        with:
          # The ONNX package downloads a prebuilt runtime and unpacks a tree
          # several times its size; paying that on every run is the difference
          # between a usable pipeline and an unusable one.
          #
          # runner.os is part of the key because the two platforms resolve
          # different packages from the same xmake.lua: without it they fight
          # over one entry and whichever saves first wins, leaving the Windows
          # build to restore a package tree that has no ONNX runtime in it.
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-

      - name: Configure
        run: xmake f -m release -y

      - name: Report the package cache size
        shell: pwsh
        run: |
          $p = Join-Path $env:USERPROFILE ".xmake\packages"
          if (Test-Path $p) {
            $bytes = (Get-ChildItem $p -Recurse -File | Measure-Object Length -Sum).Sum
            "packages: {0:N0} bytes" -f $bytes
          } else { "packages dir does not exist" }

      - name: Build
        timeout-minutes: 60
        run: xmake build -vD encro

      - name: Pack the runtime archive
        run: xmake pack -f zip encro

      - name: Pack the debug symbols as their own asset
        shell: pwsh
        run: |
          # xpack cannot exclude a target's symbol file declaratively and the
          # runtime archive strips it in after_installcmd, so the symbols travel
          # separately: a crash report can be symbolised with exactly the build
          # that produced it, without every user downloading 41 MB of PDB.
          $runtime = Get-ChildItem build/xpack/encro/*.zip | Where-Object { $_.Name -notlike '*symbols*' } | Select-Object -First 1
          if (-not $runtime) { throw "no runtime archive was produced" }
          $base = $runtime.BaseName
          $stage = Join-Path $env:RUNNER_TEMP "symbols-stage"
          New-Item -ItemType Directory -Path (Join-Path $stage "bin") -Force | Out-Null
          Copy-Item "build/windows/x64/release/encro.pdb" (Join-Path $stage "bin/encro.pdb")
          Compress-Archive -Path (Join-Path $stage "bin") -DestinationPath "build/xpack/encro/$base-symbols.zip"

      - name: List the produced archives
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem build/xpack/encro -File | ForEach-Object {
            "=== {0}  ({1:N0} bytes) ===" -f $_.Name, $_.Length
            $z = [System.IO.Compression.ZipFile]::OpenRead($_.FullName)
            $z.Entries | ForEach-Object { "    {0,-34} {1,12}" -f $_.FullName, $_.Length }
            $z.Dispose()
          }

      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-windows
          path: build/xpack/encro/*.zip
          if-no-files-found: error

      - name: Locate the VC redistributable source
        shell: pwsh
        run: |
          # The five DLLs the package ships must come from the Visual Studio
          # redistributable directory, so their version follows the build
          # rather than the machine. Never from C:\Windows\System32.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found" }
          $vsPath = & $vswhere -latest -products * -property installationPath
          "VS install: $vsPath"
          $crt = Get-ChildItem (Join-Path $vsPath 'VC\Redist\MSVC') -Recurse -Directory -Filter 'Microsoft.VC*.CRT' |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "no x64 VC redistributable directory under $vsPath" }
          "redist dir: $($crt.FullName)"
          $wanted = 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_atomic_wait.dll', 'vcruntime140.dll', 'vcruntime140_1.dll'
          foreach ($n in $wanted) {
            $f = Join-Path $crt.FullName $n
            if (Test-Path $f) { '{0,-30} {1,9} bytes' -f $n, (Get-Item $f).Length }
            else { throw "$n missing from $($crt.FullName)" }
          }

      - name: Save xmake packages cache
        # Save even when the job failed, or every run pays the full download.
        if: always() && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}

  linux:
    name: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Pin xmake's global directory to a path the cache can name
        run: |
          # xmake appends `.xmake` to this variable, so it names the parent dir.
          echo "XMAKE_GLOBALDIR=$HOME" >> "$GITHUB_ENV"
          echo "pinned XMAKE_GLOBALDIR=$HOME"
          echo "expected packages dir: $HOME/.xmake/packages"

      - uses: actions/cache/restore@v6
        id: xmake-cache
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-

      - name: Install toolchain and dependencies
        timeout-minutes: 10
        run: bash scripts/setup-linux-env.sh

      - name: Configure
        run: xmake f -m release -y

      - name: Build
        timeout-minutes: 60
        run: xmake build -vD encro

      - name: Pack the runtime archive
        run: xmake pack -f targz encro

      - name: List the produced archives
        run: |
          for f in build/xpack/encro/*; do
            echo "=== $(basename "$f")  ($(stat -c%s "$f") bytes) ==="
            tar -tzvf "$f" || unzip -l "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-linux
          path: build/xpack/encro/*
          if-no-files-found: error

      - name: Save xmake packages cache
        if: always() && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
