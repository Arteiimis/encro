name: release

# Entry points (design D5):
#   push of a `v*` tag       publish that version
#   workflow_dispatch publish   publish a tag that already exists
#   workflow_dispatch backfill  record every tag up to a version, no artifacts
#   workflow_dispatch dry-run   gate + build + pack, publish nothing
#
# A tag pushed before this workflow existed cannot trigger it — GitHub runs the
# workflow file as it exists at the tagged commit — which is why the manual
# paths exist rather than being a convenience.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'what to do'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
          - backfill
      tag:
        description: 'tag to publish (mode=publish)'
        required: false
      until:
        description: 'record every tag at or below this version (mode=backfill)'
        required: false

concurrency:
  # Never cancel a release in flight: half-published assets are exactly what
  # this workflow exists to prevent.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XMAKE_ACTION_BUILD_CACHE: '1'

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      until: ${{ steps.resolve.outputs.until }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Work out the mode, tag and version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            mode=publish
            tag="${GITHUB_REF_NAME}"
          else
            mode="${{ inputs.mode }}"
            tag="${{ inputs.tag }}"
          fi

          if [ "$mode" = "publish" ]; then
            if ! printf '%s' "$tag" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::'$tag' does not name a version; nothing to publish"
              exit 1
            fi
            version="${tag#v}"
            echo "publishing $tag ($version)"
          elif [ "$mode" = "backfill" ]; then
            version="${{ inputs.until }}"
            if [ -z "$version" ]; then
              echo "::error::mode=backfill needs an 'until' version"
              exit 1
            fi
            echo "completing history up to $version"
          else
            # dry-run: no tag, so no version to agree with — the agreement check
            # is skipped and only the suite and the tag contract run.
            version=""
            echo "dry run: gate, build and pack, publish nothing"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "until=${{ inputs.until }}" >> "$GITHUB_OUTPUT"
          # A published version is built from the commit its tag names, not from
          # whatever main has become since; anything else publishes a release
          # whose own source is not the source of its assets.
          if [ "$mode" = "publish" ]; then
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: gate
    needs: resolve
    if: needs.resolve.outputs.mode != 'backfill'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # verify-release-tags.ps1 reads `git tag -l` and
          # `git rev-list main --first-parent`; a default shallow, single-ref
          # checkout has neither, so the gate would fail on its first line
          # rather than test anything.
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Pin xmake's global directory to a path the cache can name
        run: |
          # xmake appends `.xmake` to this variable, so it names the parent dir.
          echo "XMAKE_GLOBALDIR=$HOME" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v6
        id: xmake-cache
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-

      - name: Install toolchain and dependencies
        timeout-minutes: 10
        run: bash scripts/setup-linux-env.sh

      - name: Check the build will stamp the version the tag names
        if: needs.resolve.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          # Read the declaration out of the tagged tree, not out of main: the
          # build jobs check the tag out, so the tag's own xmake.lua is what
          # decides the version the artifacts will carry.
          declared=$(git show "${{ needs.resolve.outputs.tag }}:xmake.lua" \
            | grep -oE 'local encroVersion = "[^"]+"' \
            | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$declared" ]; then
            echo "::error::could not read the version declaration from xmake.lua at ${{ needs.resolve.outputs.tag }}"
            exit 1
          fi
          if [ "$declared" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "::error::the tag names ${{ needs.resolve.outputs.version }} but the build stamps $declared."
            echo "Nothing is packaged: the artifacts and the manifest would name the wrong version."
            exit 1
          fi
          echo "declared version $declared agrees with the tag"

      - name: Refuse a version this pipeline cannot package
        if: needs.resolve.outputs.mode == 'publish'
        run: |
          # Every tag at or below 2.0.0 predates the packaging work: its xmake.lua
          # still declares the five broken formats, so building from it would ship
          # the defect this pipeline exists to remove.
          #
          # The comparison is SemVer precedence (scripts/semver.py), not version
          # sort: version sort places 2.0.0 BEFORE 2.0.0-alpha.1 while SemVer puts
          # every pre-release below its release, so a version-sort check would let
          # the pre-release tags straight through.
          version="${{ needs.resolve.outputs.version }}"
          if ! python3 scripts/semver.py above "$version" 2.0.0; then
            echo "::error::$version is at or below the last version that predates this pipeline (2.0.0); that tree cannot produce a working package."
            exit 1
          fi
      - name: Build the test binaries
        timeout-minutes: 40
        run: xmake build -vD encro encro_e2e_tool tests e2e_tests

      - name: Unit tests
        # Run the binaries directly, exactly as ci.yml does. `xmake test-report`
        # shards and writes per-shard logs, which on a fresh runner meant a
        # failure arrived as "a shard failed" with the assertions buried in a
        # file nobody kept; the console output here is the evidence.
        run: |
          python3 scripts/run_test_suite.py \
            --binary build/linux/x86_64/release/tests \
            --report /tmp/ut.xml --log /tmp/ut.log --label "unit tests"


      - name: End-to-end tests
        timeout-minutes: 20
        run: xmake run e2e_tests

      - name: Tag contract
        run: python3 scripts/verify_release_tags.py

      - name: Changelog sections
        # The extractor's output becomes release bodies, so it is checked here
        # rather than trusted: every tag's section must start with its own
        # heading and stop before the next one or the link block.
        run: python3 scripts/verify_changelog_sections.py

      - name: Save xmake packages cache
        if: always() && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}

  windows:
    name: windows
    needs: [resolve, gate]
    if: needs.resolve.outputs.mode != 'backfill'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Pin xmake's global directory to a path the cache can name
        shell: pwsh
        run: |
          # xmake appends `.xmake` to this variable, so it names the parent
          # directory. Without the pin xmake prefers %APPDATA%\.xmake on
          # Windows, which makes `~/.xmake/packages` an empty path and the
          # cache silently stores nothing.
          "XMAKE_GLOBALDIR=$env:USERPROFILE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - uses: actions/cache/restore@v6
        id: xmake-cache
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-

      - name: Configure
        run: xmake f -m release -y

      - name: Report the package cache size
        shell: pwsh
        run: |
          # A silently empty cache path is how the first attempt failed twice
          # while reporting success, so its size is asserted every run.
          $p = Join-Path $env:USERPROFILE ".xmake\packages"
          if (Test-Path $p) {
            $bytes = (Get-ChildItem $p -Recurse -File | Measure-Object Length -Sum).Sum
            "packages: {0:N0} bytes" -f $bytes
          } else { throw "packages dir does not exist: $p" }

      - name: Build
        timeout-minutes: 60
        run: xmake build -vD encro encro_e2e_tool tests e2e_tests

      - name: Unit tests
        # The gate ran the suite on Linux; publishing a Windows binary that was
        # never tested on Windows would be the same class of mistake as
        # publishing one that cannot start. Same reporter as the gate, so a
        # failure reads the same on both platforms.
        run: |
          python scripts/run_test_suite.py `
            --binary build/windows/x64/release/tests.exe `
            --report test-output/ut.xml --log test-output/ut.log `
            --label "unit tests on Windows"


      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-output
          path: test-output/
          if-no-files-found: warn

      - name: End-to-end tests
        timeout-minutes: 20
        run: |
          python scripts/run_test_suite.py `
            --binary build/windows/x64/release/e2e_tests.exe `
            --report test-output/e2e.xml --log test-output/e2e.log `
            --label "e2e tests on Windows"


      - name: Pack the runtime archive
        run: xmake pack -f zip encro

      - name: Pack the debug symbols as their own asset
        # xpack copies a target's symbol file into bin/ unconditionally and has no
        # declarative exclude, so after_installcmd strips it from the runtime
        # archive; the symbols ship separately so a crash report can be symbolised
        # by exactly the build that produced it, and they carry the licence and
        # README because every distributed artifact does.
        run: python scripts/windows_package.py pack-symbols
      - name: Assert the package contents and run the packaged executable
        # The archive is what a user receives, so it is the thing to run: a
        # package whose own binary cannot start is how 2.0.1 shipped. Listing the
        # contents without asserting them is how the wrong runtime shipped inside
        # it, so both live in one script instead of two shell steps.
        run: python scripts/windows_package.py verify
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-windows
          path: build/xpack/encro/*.zip
          if-no-files-found: error

      - name: Save xmake packages cache
        if: always() && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}

  linux:
    name: linux
    needs: [resolve, gate]
    if: needs.resolve.outputs.mode != 'backfill'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Pin xmake's global directory to a path the cache can name
        run: |
          echo "XMAKE_GLOBALDIR=$HOME" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v6
        id: xmake-cache
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-

      - name: Install toolchain and dependencies
        timeout-minutes: 10
        run: bash scripts/setup-linux-env.sh

      - name: Configure
        run: xmake f -m release -y

      - name: Build
        timeout-minutes: 60
        run: xmake build -vD encro

      - name: Pack the runtime archive
        run: xmake pack -f targz encro

      - name: List the produced archives
        run: |
          for f in build/xpack/encro/*; do
            echo "=== $(basename "$f")  ($(stat -c%s "$f") bytes) ==="
            tar -tzvf "$f" || unzip -l "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-linux
          path: build/xpack/encro/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [resolve, gate, windows, linux]
    if: needs.resolve.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show what will be published
        run: ls -la dist

      - name: Stop if this version is already published
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already published — leaving it untouched."
            # Build and publish are separate here, so a re-run can still report
            # whether the same source reproduces the same bytes, which is the
            # only way "same source, same artifact" stays checkable after the
            # fact. Reporting a difference never replaces anything.
            mkdir -p published
            gh release download "v$VERSION" --dir published --pattern '*.zip' --pattern '*.tar.gz' || true
            for f in dist/*; do
              base=$(basename "$f")
              if [ -f "published/$base" ]; then
                a=$(sha256sum "$f" | cut -d' ' -f1)
                b=$(sha256sum "published/$base" | cut -d' ' -f1)
                if [ "$a" = "$b" ]; then
                  echo "  $base: identical to the published asset"
                else
                  echo "::warning::$base differs from the published asset; the published one is kept"
                fi
              else
                echo "  $base: not present in the published release"
              fi
            done
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: steps.existing.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/changelog.py section "$VERSION" > body.md
          if [ ! -s body.md ]; then
            echo "::error::the changelog has no section for $VERSION; refusing to publish an invented body"
            exit 1
          fi
          head -3 body.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file body.md \
            dist/*
          echo "published v$VERSION"

      - name: Publish the Scoop manifest
        id: bucket
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          asset="encro-$VERSION-x64-windows.zip"
          url="https://github.com/${{ github.repository }}/releases/download/v$VERSION/$asset"
          # The checksum has to describe the bytes a user downloads, not the ones
          # this run just rebuilt: those differ (a rebuild is not reproducible in
          # practice), and a manifest carrying a rebuild's hash makes every
          # install fail the verification it exists to perform.
          hash=$(gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest" | sed 's/^sha256://')
          if [ -z "$hash" ]; then
            echo "::error::the release has no $asset to describe; leaving the bucket alone"
            exit 1
          fi
          local_hash=$(sha256sum "dist/$asset" | cut -d' ' -f1)
          if [ "$local_hash" != "$hash" ]; then
            echo "::warning::the rebuild of $asset differs from the published bytes; the manifest describes the published ones"
          fi

          # A deploy key scoped to the bucket repository, rather than a personal
          # access token: it reaches that one repository, is useless anywhere
          # else, and does not expire underneath the release pipeline.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SCOOP_BUCKET_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

          work=$(mktemp -d)
          git clone --depth 1 git@github.com:Arteiimis/scoop-encro.git "$work/bucket-repo"
          mkdir -p "$work/bucket-repo/bucket"
          cat > "$work/bucket-repo/bucket/encro.json" <<EOF
          {
            "version": "$VERSION",
            "description": "Batch media processing CLI built on ffmpeg",
            "homepage": "https://github.com/${{ github.repository }}",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "$url",
                "hash": "$hash"
              }
            },
            "bin": "bin\\\\encro.exe",
            "notes": "encro drives ffmpeg and ffprobe; install both and make sure they are on PATH (or pass --ffmpeg-path).",
            "checkver": {
              "github": "https://github.com/${{ github.repository }}"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/v\$version/encro-\$version-x64-windows.zip"
                }
              }
            }
          }
          EOF
          cd "$work/bucket-repo"
          # `git diff` alone would skip a manifest that is not tracked yet, which
          # is exactly the first publish.
          git add bucket/encro.json
          if git diff --cached --quiet; then
            echo "bucket manifest already names $VERSION"
          else
            git -c user.name="encro release" -c user.email="releases@users.noreply.github.com" \
              commit -q -m "encro $VERSION"
            git push -q origin HEAD:main
            echo "bucket manifest updated to $VERSION"
          fi

      - name: Report a stale bucket
        if: steps.bucket.outcome == 'failure'
        run: |
          echo "::warning::the release is published but the Scoop bucket was not updated; re-run this step by hand"

  backfill:
    name: backfill
    needs: resolve
    if: needs.resolve.outputs.mode == 'backfill'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Record every tag up to the boundary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/record_release_history.py --until "${{ needs.resolve.outputs.until }}"
